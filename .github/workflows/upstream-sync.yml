name: upstream-sync

# Every morning, pull the latest commits of the repository this fork was forked
# from into one pull request. `.github/scripts/upstream-sync.ts` fetches the
# upstream default branch, and when it is ahead of `main` it rewrites the
# `sync/upstream` branch (main plus a clean merge of upstream, or the raw
# upstream tip when the merge conflicts) and opens the PR or updates the one
# already open. Nothing happens while the fork is in sync.
#
# Standalone and outside the merge gate, like docker-image.yml.
#
# Tokens: with the default GITHUB_TOKEN the PR is created but, as for every
# event caused by that token, no `pull_request` workflow runs on it. Add a
# fine-grained PAT (contents + pull requests, read/write) as the
# UPSTREAM_SYNC_TOKEN secret and the sync PR gets CI like any other.

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai, before the working day starts.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print the plan without pushing or touching the PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main with the upstream default branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # A broken helper must fail here, loudly, not quietly report "in sync".
      - name: Check sync script
        run: node --experimental-strip-types .github/scripts/upstream-sync.ts self-check

      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node --experimental-strip-types .github/scripts/upstream-sync.ts run ${{ inputs.dry_run == true && '--dry-run' || '' }}
