name: npm-publish

# Builds the single-package npm distribution of OpenDesign (`od` CLI + daemon +
# web UI + bundled resources) with `tools-pack npm build`, installs the tarball
# into an empty prefix and boots it (`tools-pack npm smoke`), then publishes to
# npm when a GitHub Release is published (or via manual workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_name:
        description: "npm package name"
        required: false
        default: "@randalvance/open-design"
      app_version:
        description: "Package version override (defaults to root package.json version)"
        required: false
        default: ""
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"
      dry_run:
        description: "Run `npm publish --dry-run` instead of publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke, and publish the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the npm package
        id: build
        env:
          PACKAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.package_name || '@randalvance/open-design' }}
          INPUT_APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.app_version || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          args=(npm build --json)
          if [ -n "$PACKAGE_NAME" ]; then args+=(--package-name "$PACKAGE_NAME"); fi
          app_version="$INPUT_APP_VERSION"
          if [ -z "$app_version" ] && [ -n "$RELEASE_TAG" ]; then
            app_version="${RELEASE_TAG#v}"
          fi
          if [ -n "$app_version" ]; then args+=(--app-version "$app_version"); fi
          pnpm --silent tools-pack "${args[@]}" | tee npm-build.json
          tarball="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("npm-build.json","utf8")).tarballPath)')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke the installed package
        run: pnpm --silent tools-pack npm smoke --tarball "${{ steps.build.outputs.tarball }}" --json

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || (github.event.release.prerelease && 'next' || 'latest') }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          args=(publish "$TARBALL" --access public --provenance --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm "${args[@]}"
